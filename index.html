<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#13151a">
<title>Iron Ledger</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans:wght@400;500;600;700&family=Saira+Semi+Condensed:wght@500;600;700&display=swap">
<style>
/* Layout: one-screen app — sticky title bar, scrolling view, fixed bottom tab bar. Dark-first instrument-panel palette. */
:root{
  --bg:#f3f4f7; --surface:#ffffff; --surface-2:#eceef2; --raise:#f7f8fa;
  --line:#dadee6; --fg:#191d25; --muted:#5b6473;
  --accent:#c9732a; --on-accent:#fff; --accent-weak:rgba(201,115,42,.12);
  --up:#1f8f5f; --down:#cf4b45; --planned:#5f6f94;
  --shadow:0 1px 2px rgba(20,25,35,.06),0 6px 20px rgba(20,25,35,.05);
  --font-display:"Saira Semi Condensed",system-ui,sans-serif;
  --font-body:"IBM Plex Sans",system-ui,-apple-system,Segoe UI,Roboto,sans-serif;
  --r:14px; --r-sm:10px;
  padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px);
  color-scheme:light;
}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){
  --bg:#13151a; --surface:#1b1e26; --surface-2:#23262f; --raise:#20242d;
  --line:#2d313b; --fg:#eef1f6; --muted:#98a2b2;
  --accent:#f2a24a; --on-accent:#1a1205; --accent-weak:rgba(242,162,74,.14);
  --up:#3ed08b; --down:#f0736c; --planned:#8a98b8;
  --shadow:0 1px 2px rgba(0,0,0,.3),0 8px 24px rgba(0,0,0,.28);
  color-scheme:dark;
}}
:root[data-theme="dark"]{
  --bg:#13151a; --surface:#1b1e26; --surface-2:#23262f; --raise:#20242d;
  --line:#2d313b; --fg:#eef1f6; --muted:#98a2b2;
  --accent:#f2a24a; --on-accent:#1a1205; --accent-weak:rgba(242,162,74,.14);
  --up:#3ed08b; --down:#f0736c; --planned:#8a98b8;
  --shadow:0 1px 2px rgba(0,0,0,.3),0 8px 24px rgba(0,0,0,.28);
  color-scheme:dark;
}
*{box-sizing:border-box}
html,body{height:100%}
body{margin:0;background:var(--bg);color:var(--fg);font-family:var(--font-body);font-size:15px;line-height:1.45;-webkit-font-smoothing:antialiased;overflow-x:hidden}
img{max-width:100%}
[hidden]{display:none!important}
#app{min-height:100%;display:flex;flex-direction:column}
.num{font-variant-numeric:tabular-nums}
h1,h2,h3{font-family:var(--font-display);font-weight:600;margin:0;letter-spacing:.2px;text-wrap:balance}
button{font-family:inherit;font-size:inherit;color:inherit;cursor:pointer;border:none;background:none}
input,select,textarea{font-family:inherit;font-size:16px;color:var(--fg)}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px;border-radius:6px}

/* header */
header{position:sticky;top:env(safe-area-inset-top,0px);z-index:15;background:var(--surface);border-bottom:1px solid var(--line)}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:16;background:var(--surface)}
.hwrap{display:flex;align-items:center;gap:10px;min-height:52px;
  padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
.brand{font-family:var(--font-display);font-weight:700;font-size:20px;letter-spacing:.4px;display:flex;align-items:center;gap:8px}
.brand .mk{width:16px;height:16px;border-radius:3px;background:var(--accent);box-shadow:inset 0 0 0 3px var(--surface),0 0 0 2px var(--accent)}
.sync{margin-left:auto;display:flex;align-items:center;gap:6px;font-size:11px;color:var(--muted);letter-spacing:.5px}
.sync .dot{width:7px;height:7px;border-radius:50%;background:var(--muted)}
.sync.ok .dot{background:var(--up)}
.sync.local .dot{background:var(--planned)}
.sync.off .dot{background:var(--down)}

/* layout */
main{flex:1;width:100%;max-width:720px;margin:0 auto;
  padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));
  padding-top:16px;padding-bottom:calc(76px + env(safe-area-inset-bottom,0px))}
.view{display:flex;flex-direction:column;gap:14px}
section.block{display:flex;flex-direction:column;gap:12px}

/* tab bar */
.tabbar{position:fixed;left:0;right:0;bottom:0;z-index:20;background:var(--surface);border-top:1px solid var(--line);
  padding-bottom:env(safe-area-inset-bottom,0px);
  padding-left:max(8px,env(safe-area-inset-left,0px));padding-right:max(8px,env(safe-area-inset-right,0px))}
.tabs{display:flex;max-width:720px;margin:0 auto}
.tab{flex:1;display:flex;flex-direction:column;align-items:center;gap:3px;padding:9px 4px 7px;color:var(--muted);font-size:10.5px;letter-spacing:.4px;text-transform:uppercase;font-weight:600;border-top:2px solid transparent;margin-top:-1px}
.tab svg{width:22px;height:22px;stroke:currentColor;fill:none;stroke-width:1.9}
.tab.active{color:var(--accent);border-top-color:var(--accent)}

/* cards */
.card{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);box-shadow:var(--shadow)}
.pad{padding:14px}
.eyebrow{font-size:11px;letter-spacing:1.4px;text-transform:uppercase;color:var(--muted);font-weight:600}
.muted{color:var(--muted)}
.row{display:flex;align-items:center;gap:10px}
.spread{display:flex;align-items:center;justify-content:space-between;gap:10px}
.wrap{flex-wrap:wrap}
.grow{flex:1;min-width:0}
.right{margin-left:auto}

/* buttons */
.btn{display:inline-flex;align-items:center;justify-content:center;gap:7px;padding:11px 16px;border-radius:var(--r-sm);background:var(--surface-2);color:var(--fg);font-weight:600;border:1px solid transparent;transition:transform .05s}
.btn:active{transform:scale(.97)}
.btn.primary{background:var(--accent);color:var(--on-accent)}
.btn.ghost{background:transparent;border-color:var(--line)}
.btn.sm{padding:7px 11px;font-size:13px}
.btn.block{width:100%}
.btn.danger{color:var(--down)}
.btn[disabled]{opacity:.5;pointer-events:none}
.iconbtn{width:38px;height:38px;border-radius:var(--r-sm);display:inline-flex;align-items:center;justify-content:center;background:var(--surface-2)}
.iconbtn svg{width:19px;height:19px;stroke:currentColor;fill:none;stroke-width:2}
.btn svg{width:18px;height:18px;stroke:currentColor;fill:none;stroke-width:2;flex:none}
.go{display:inline-flex;align-items:center;color:var(--muted);flex:none}
.go svg{width:18px;height:18px;stroke:currentColor;fill:none;stroke-width:2}
.big-cta{font-family:var(--font-display);font-size:19px;letter-spacing:.5px;padding:16px}

/* pills */
.pill{display:inline-flex;align-items:center;gap:5px;padding:3px 9px;border-radius:999px;font-size:11.5px;font-weight:600;letter-spacing:.3px;background:var(--surface-2);color:var(--muted)}
.pill.done{background:rgba(31,143,95,.14);color:var(--up)}
.pill.planned{background:rgba(95,111,148,.16);color:var(--planned)}
.pill.partial{background:var(--accent-weak);color:var(--accent)}

/* stat tiles */
.tiles{display:grid;grid-template-columns:repeat(3,1fr);gap:10px}
.tile{background:var(--surface);border:1px solid var(--line);border-radius:var(--r-sm);padding:12px}
.tile .v{font-family:var(--font-display);font-size:26px;font-weight:700;line-height:1}
.tile .l{font-size:11px;color:var(--muted);letter-spacing:.4px;margin-top:5px;text-transform:uppercase}

/* exercise entry (log) */
.entry{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);box-shadow:var(--shadow);overflow:hidden}
.entry-h{display:flex;align-items:flex-start;gap:10px;padding:12px 12px 10px}
.entry-h .nm{font-family:var(--font-display);font-size:18px;font-weight:600;line-height:1.1}
.lasttime{font-size:12.5px;color:var(--muted);margin-top:3px}
.lasttime b{color:var(--fg);font-weight:600}
.hint{display:flex;gap:7px;align-items:flex-start;margin:0 12px 10px;padding:8px 10px;background:var(--accent-weak);border-radius:var(--r-sm);font-size:12.5px;color:var(--fg)}
.hint svg{width:15px;height:15px;flex:none;margin-top:2px;stroke:var(--accent);fill:none;stroke-width:2}
.setrow{display:grid;grid-template-columns:30px 1fr 1fr 44px;align-items:center;gap:8px;padding:7px 12px;border-top:1px solid var(--line)}
.setrow .sn{font-family:var(--font-display);font-weight:700;color:var(--muted);text-align:center}
.setrow.warm .sn{color:var(--planned)}
.field{display:flex;align-items:center;background:var(--surface-2);border-radius:var(--r-sm);overflow:hidden;height:40px}
.field button{width:34px;height:100%;font-size:20px;font-weight:600;color:var(--muted);flex:none}
.field button:active{color:var(--accent)}
.field input{width:100%;min-width:0;border:none;background:none;text-align:center;font-family:var(--font-display);font-weight:700;font-size:17px;padding:0;outline:none}
.field .u{font-size:10px;color:var(--muted);padding-right:8px;letter-spacing:.3px}
.setrow .chk{width:40px;height:40px;border-radius:var(--r-sm);border:1.5px solid var(--line);background:var(--surface-2);display:flex;align-items:center;justify-content:center}
.setrow .chk svg{width:20px;height:20px;stroke:var(--muted);fill:none;stroke-width:2.4;opacity:.4}
.setrow.on .chk{background:var(--up);border-color:var(--up)}
.setrow.on .chk svg{stroke:#fff;opacity:1}
.setrow.on .field input{color:var(--fg)}
.entry-actions{display:flex;gap:8px;padding:10px 12px;border-top:1px solid var(--line);background:var(--raise)}
.entry.skipped{opacity:.55}
.collabel{display:grid;grid-template-columns:30px 1fr 1fr 44px;gap:8px;padding:2px 12px 0;font-size:10px;letter-spacing:.5px;text-transform:uppercase;color:var(--muted)}
.collabel span{text-align:center}

/* lists */
.list{display:flex;flex-direction:column;gap:10px}
.item{display:flex;align-items:center;gap:12px;padding:12px 14px;background:var(--surface);border:1px solid var(--line);border-radius:var(--r);box-shadow:var(--shadow);text-align:left;width:100%}
.item .t{font-family:var(--font-display);font-size:16px;font-weight:600}
.item .s{font-size:12.5px;color:var(--muted)}
.weekhead{font-size:11px;letter-spacing:1px;text-transform:uppercase;color:var(--muted);font-weight:600;margin:6px 2px 0}

/* chips */
.chips{display:flex;gap:8px;overflow-x:auto;padding-bottom:4px;-webkit-overflow-scrolling:touch}
.chip{flex:none;padding:8px 13px;border-radius:999px;background:var(--surface-2);border:1px solid transparent;font-weight:600;font-size:13px;white-space:nowrap;color:var(--muted)}
.chip.active{background:var(--accent);color:var(--on-accent)}
.seg{display:inline-flex;background:var(--surface-2);border-radius:10px;padding:3px;gap:2px;flex:none}
.seg button{padding:6px 11px;border-radius:8px;font-size:12px;font-weight:600;color:var(--muted);white-space:nowrap}
.seg button.on{background:var(--surface);color:var(--fg);box-shadow:var(--shadow)}

/* empty */
.empty{text-align:center;padding:28px 18px;color:var(--muted);display:flex;flex-direction:column;align-items:center;gap:8px}
.empty svg{width:34px;height:34px;stroke:var(--muted);fill:none;stroke-width:1.6;opacity:.6}
.empty .big{font-family:var(--font-display);font-size:17px;color:var(--fg);font-weight:600}

/* chart */
.chartwrap{width:100%;overflow:hidden}
svg.chart{width:100%;height:auto;display:block}
.chart text{font-family:var(--font-body);fill:var(--muted)}

/* modal */
#modal{position:fixed;inset:0;z-index:40;display:none;align-items:flex-end;justify-content:center;background:rgba(10,12,16,.55)}
#modal.open{display:flex}
.sheet{background:var(--surface);width:100%;max-width:560px;max-height:88vh;overflow-y:auto;border-radius:18px 18px 0 0;
  padding:16px;padding-bottom:calc(16px + env(safe-area-inset-bottom,0px));
  box-shadow:0 -10px 40px rgba(0,0,0,.3);animation:rise .18s ease}
@media(min-width:620px){#modal{align-items:center}.sheet{border-radius:18px;max-height:84vh}}
@keyframes rise{from{transform:translateY(16px);opacity:.6}to{transform:none;opacity:1}}
@media(prefers-reduced-motion:reduce){.sheet{animation:none}.btn:active{transform:none}}
.sheet h2{font-size:21px;margin-bottom:4px}
.formrow{display:flex;flex-direction:column;gap:5px;margin-top:12px}
.formrow label{font-size:12px;letter-spacing:.4px;text-transform:uppercase;color:var(--muted);font-weight:600}
.inp{width:100%;padding:11px 12px;border:1px solid var(--line);border-radius:var(--r-sm);background:var(--surface-2)}
.two{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.three{display:grid;grid-template-columns:1fr 1fr 1fr;gap:10px}
.pickitem{display:flex;align-items:center;gap:10px;padding:11px 12px;border:1px solid var(--line);border-radius:var(--r-sm);background:var(--surface);width:100%;text-align:left;margin-top:8px}
.pickitem .t{font-family:var(--font-display);font-weight:600;font-size:15px}
.search{position:sticky;top:0;background:var(--surface);padding-bottom:8px}
hr.sep{border:none;border-top:1px solid var(--line);margin:14px 0}
.helptext{font-size:12px;color:var(--muted);margin-top:4px}
.toast{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(84px + env(safe-area-inset-bottom,0px));z-index:50;background:var(--fg);color:var(--bg);padding:10px 16px;border-radius:999px;font-weight:600;font-size:13px;box-shadow:var(--shadow);opacity:0;transition:opacity .2s;pointer-events:none}
.toast.show{opacity:1}

/* auth + splash */
#splash,#auth{position:fixed;inset:0;z-index:60;display:flex;flex-direction:column;align-items:center;justify-content:center;background:var(--bg);
  padding-left:max(20px,env(safe-area-inset-left,0px));padding-right:max(20px,env(safe-area-inset-right,0px))}
.authcard{width:100%;max-width:360px;display:flex;flex-direction:column;gap:12px}
.authbrand{font-family:var(--font-display);font-weight:700;font-size:32px;letter-spacing:.6px;display:flex;align-items:center;gap:10px;justify-content:center;margin-bottom:2px}
.authbrand .mk{width:22px;height:22px;border-radius:4px;background:var(--accent);box-shadow:inset 0 0 0 4px var(--bg),0 0 0 2px var(--accent)}
.authsub{text-align:center;color:var(--muted);font-size:13.5px;margin-bottom:10px}
.authmsg{font-size:13px;padding:10px 12px;border-radius:var(--r-sm);display:none}
.authmsg.err{display:block;background:rgba(207,75,69,.14);color:var(--down)}
.authmsg.ok{display:block;background:rgba(31,143,95,.14);color:var(--up)}
.authtoggle{text-align:center;font-size:13px;color:var(--muted);margin-top:6px}
.authtoggle button{color:var(--accent);font-weight:600}
.spin{width:26px;height:26px;border:3px solid var(--line);border-top-color:var(--accent);border-radius:50%;animation:sp .7s linear infinite}
@keyframes sp{to{transform:rotate(360deg)}}
</style>
</head>
<body>

<div id="splash"><div class="spin"></div></div>
<div id="auth" hidden></div>

<div id="app" hidden>
  <header>
    <div class="hwrap">
      <div class="brand"><span class="mk"></span>Iron Ledger</div>
      <div class="sync local" id="sync"><span class="dot"></span><span id="synctxt">Local</span></div>
    </div>
  </header>
  <main><div id="view" class="view"></div></main>
  <nav class="tabbar"><div class="tabs" id="tabs"></div></nav>
</div>

<div id="modal"><div class="sheet" id="sheet"></div></div>
<div class="toast" id="toast"></div>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.45.0/dist/umd/supabase.min.js"></script>
<script src="config.js"></script>
<script src="app.js"></script>
</body>
</html>
